
# Policy yaml consumed by deploy_diffuser_actor.py — must match what was
# in scope during training (LangSteer/conf/training/diffuser_actor_realworld_primitive_object.yaml).
# Any drift here vs the trainer config will cause silent shape/index errors.

name: diffuser_actor
ckpt_path: "/home/clear/franka-teleop/checkpoints/simple_v1.pth"
device: "cuda"

# Joint config the arm moves to before inference for this policy (7 angles).
# Read by deploy_diffuser_actor; travels with the policy so no CLI flag needed.
home_config: [0.249339, -0.199937, -0.391007, -2.437545, -0.078345, 2.240440, 0.001707]

# Architecture — identical to the trained checkpoint.
backbone: clip
image_size: [256, 256]
embedding_dim: 192
num_vis_ins_attn_layers: 2
use_instruction: true
use_primitive_id: true
num_primitives: 2          # grasp=0, place=1
use_object_id: true
num_objects: 1             # glass=0
primitive_vocab:
  grasp: 0
  place: 1
object_vocab:
  glass: 0
fps_subsampling_factor: 3
#gripper_loc_bounds: [[-0.4056, -0.4340, -0.6588], [0.5103, 0.2986, 0.3674]]
gripper_loc_bounds: [[-0.1831, -0.3360, -0.2274], [0.1831, 0.3360, 0.2274]]
rotation_parametrization: "6D"
quaternion_format: "wxyz"
diffusion_timesteps: 25
nhist: 3
relative: true
lang_enhanced: true

# Inference
pred_horizon: 20

# Camera setup — same key order the dataset stored.
cameras: ["front", "wrist"]
crop_images: true

mask_language: false
corrector_steps: 0
corrector_step_size: 0.001
