mode: teleop  # teleop or replay

net_franky:
  ip: "172.16.0.1"
  port: 18812

robot:
  ip: "172.16.0.2"

data_dir: ./data

teleop:
  linear_scale: 0.1
  angular_scale: 0.5
  period: 0.001
  global_frame: true
  translational_stiffness: 100.0
  rotational_stiffness: 5.0
  nullspace_stiffness: 2.0
  reset_joint_config: [-0.06217873,  0.11705305, -0.5995304 , -2.72505689,  1.98229098, 1.78315043,  0.44959301]
  spacemouse:
    control_rate: 120
    smoothing_factor: 0.3
    softmax_temp: 0.85
    translation_deadband: 0.08
    rotation_deadband: 0.08

cameras:
  third_person:
    name: third_person
    enabled: true
    serial_number: 37820861
    resolution: HD720
    fps: 30
    depth_mode: NEURAL
  hand:
    name: hand
    enabled: true
    serial_number: 10986074
    resolution: HD720
    fps: 30
    depth_mode: NEURAL

gripper:
  enabled: true
  host: "172.16.0.1"      # Host running rpyc_classic with pyrobotiqgripper.
  port: 18812
  com_port: auto
  device_id: 9
  connection_type: RTU    # RTU | RTU_VIA_TCP
  tcp_host: "127.0.0.1"
  tcp_port: 54321
  activate_on_start: true
  initial_open: true
  open_width_m: 0.085
  close_width_m: 0.0
  max_width_m: 0.085
  speed: 255
  force: 255

visualization:
  viser:
    enabled: false
    host: "0.0.0.0"
    port: 8080
    update_hz: 30.0
    pointclouds:
      third_person:
        enabled: false
        extrinsics_path: ./data/extrinsics_third_person.json
        frame_name: /third_person_zed
        update_hz: 5.0
        stride: 4
        max_points: 100000
        max_distance_m: 3.0
        point_size: 0.01
      hand:
        enabled: false
        extrinsics_path: ./data/extrinsics_hand.json
        # Child of the Franka end-effector/flange frame in the viser URDF.
        frame_name: /cortado/fr3_link8/hand_zed
        update_hz: 5.0
        stride: 4
        max_points: 100000
        max_distance_m: 3.0
        point_size: 0.01

recorder:
  record_svo: false           # true = native ZED SVO2 files; false = HDF5 frames
  svo_compression: H265_LOSSLESS       # H264 | H265 | LOSSLESS | H264_LOSSLESS | H265_LOSSLESS

replay:
  episode: null  # path to .h5 file, or null for latest in data_dir
  speed: 1.0
  period: 0.001
  # Joint impedance gains. Stiffer = better tracking, less compliance.
  # [50, 50, 50, 50, 20, 20, 10] is a reasonable starting point; tune per arm.
  joint_stiffness: [80.0, 80.0, 80.0, 80.0, 30.0, 30.0, 15.0]
  # Pre-positioning move to the first joint configuration of the episode.
  preposition_dynamics_factor: 0.1  # fraction of max velocity/accel/jerk
  preposition_settle_s: 0.5         # pause after preposition before streaming
  record: false                     # save measured robot state as a new episode

calibration:
  camera_mount: third_person           # third_person | hand
  min_charuco_corners: 12             # require for capture if fewer corners
  reprojection_error_max_px: 1.5      # mean reprojection error threshold
  board_position_std_max_mm: 5.0      # per-axis std of recovered board origin

  kinesthetic:
    # Low joint impedance so the operator can backdrive the arm by hand.
    # Franka's built-in gravity comp keeps the arm afloat; the tracker just
    # damps oscillation. Bump these up if the arm drifts under load.
    joint_stiffness: [5.0, 5.0, 5.0, 5.0, 3.0, 3.0, 2.0]

  board:
    # Physical printed ChArUco board. Must match what is mounted to the gripper.
    squares_x: 14
    squares_y: 9
    square_length_m: 0.020
    marker_length_m: 0.015
    dictionary: DICT_5X5_100         # cv2.aruco.DICT_*
