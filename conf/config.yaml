mode: teleop  # teleop or replay

net_franky:
  ip: "172.16.0.1"
  port: 18812

robot:
  ip: "172.16.0.2"

data_dir: ./data

teleop:
  linear_scale: 0.1
  angular_scale: 0.5
  period: 0.001
  global_frame: true
  translational_stiffness: 200.0
  rotational_stiffness: 10.0
  nullspace_stiffness: 2.0
  spacemouse:
    control_rate: 120
    smoothing_factor: 0.3
    softmax_temp: 0.85
    translation_deadband: 0.08
    rotation_deadband: 0.08

camera:
  enabled: false          # Set true when ZED 2i is connected
  resolution: HD2K      # HD2K, HD1080, HD720, VGA
  fps: 30                 # HD2K caps at 15fps; HD1080/HD720 up to 30; VGA up to 100
  depth_mode: PERFORMANCE # NONE, PERFORMANCE, QUALITY, ULTRA, NEURAL

replay:
  episode: null  # path to .h5 file, or null for latest in data_dir
  speed: 1.0
  period: 0.001
  # Joint impedance gains. Stiffer = better tracking, less compliance.
  # [50, 50, 50, 50, 20, 20, 10] is a reasonable starting point; tune per arm.
  joint_stiffness: [80.0, 80.0, 80.0, 80.0, 30.0, 30.0, 15.0]
  # Pre-positioning move to the first joint configuration of the episode.
  preposition_dynamics_factor: 0.1  # fraction of max velocity/accel/jerk
  preposition_settle_s: 0.5         # pause after preposition before streaming

calibration:
  mode: manual                        # manual | replay | sweep
  output: ./data/extrinsics_third_person.json
  waypoints_file: ./data/calibration_waypoints.json  # manual saves here; replay reads here
  debug_dir: ./data/calibration_debug  # per-waypoint annotated images (null to disable)
  relative_dynamics_factor: 0.05      # franky velocity/accel/jerk scaling (replay/sweep)
  settle_seconds: 1                   # pause after motion finishes before grabbing
  min_charuco_corners: 12             # skip waypoint / require for capture if fewer corners
  reprojection_error_max_px: 1.5      # mean reprojection error threshold
  board_position_std_max_mm: 5.0      # per-axis std of recovered board origin

  kinesthetic:
    # Low Cartesian impedance so the operator can backdrive the arm by hand.
    # Franka's built-in gravity comp keeps the arm afloat; the tracker just
    # damps oscillation. Bump these up if the arm drifts under load.
    translational_stiffness: 0.0
    rotational_stiffness: 0.0
    nullspace_stiffness: 0.0
    period: 0.001

  board:
    # Physical printed ChArUco board. Must match what is mounted to the gripper.
    squares_x: 14
    squares_y: 9
    square_length_m: 0.020
    marker_length_m: 0.015
    dictionary: DICT_5X5_100         # cv2.aruco.DICT_*

  # Center pose of the calibration sweep (board in third-person camera FOV).
  # Position in [m], orientation in xyz Euler [rad].
  home:
    position: [0.45, 0.0, 0.40]
    euler_xyz: [3.14159, 0.0, 0.0]    # gripper pointing down

  # Sweep design — perturbations from the home pose. The script combines these
  # to build a varied list of waypoints. Override per-physical-setup as needed.
  sweep:
    position_offsets_m:
      - [0.0,  0.0,  0.0]
      - [0.10, 0.0,  0.0]
      - [-0.10, 0.0, 0.0]
      - [0.0,  0.10, 0.0]
      - [0.0, -0.10, 0.0]
      - [0.0,  0.0,  0.10]
      - [0.0,  0.0, -0.10]
      - [0.10, 0.10, 0.0]
      - [-0.10, -0.10, 0.0]
      - [0.05, 0.05, 0.10]
    # Each entry is an extra Euler-xyz delta [rad] composed onto home orientation.
    rotation_offsets_rad:
      - [0.0,   0.0,    0.0]
      - [0.52,  0.0,    0.0]    #  +30° roll
      - [-0.52, 0.0,    0.0]    #  -30° roll
      - [0.0,   0.52,   0.0]    #  +30° pitch
      - [0.0,  -0.52,   0.0]    #  -30° pitch
      - [0.0,   0.0,    0.78]   #  +45° yaw
      - [0.0,   0.0,   -0.78]   #  -45° yaw
      - [0.35,  0.35,   0.0]    #  combined
      - [-0.35, 0.35,   0.35]
      - [0.35, -0.35,  -0.35]
