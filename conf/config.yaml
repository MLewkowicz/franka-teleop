mode: teleop  # teleop or replay

net_franky:
  ip: "172.16.0.1"
  port: 18812

robot:
  ip: "172.16.0.2"

data_dir: ./data

teleop:
  linear_scale: 0.1
  angular_scale: 0.5
  period: 0.001
  global_frame: true
  translational_stiffness: 200.0
  rotational_stiffness: 10.0
  nullspace_stiffness: 2.0
  spacemouse:
    control_rate: 120
    smoothing_factor: 0.3
    softmax_temp: 0.85
    translation_deadband: 0.08
    rotation_deadband: 0.08

replay:
  episode: null  # path to .h5 file, or null for latest in data_dir
  speed: 1.0
  translational_stiffness: 200.0
  rotational_stiffness: 10.0
  nullspace_stiffness: 2.0
  period: 0.001
