[project]
name = "franka-teleop"
version = "0.1.0"
description = "SpaceMouse teleoperation and trajectory recording for Franka Panda"
requires-python = ">=3.12"
dependencies = [
    "net-franky",
    "numpy>=1.20",
    "h5py>=3.0",
    "hydra-core>=1.3",
    "threed-mouse",
]

[project.optional-dependencies]
camera = [
    "pyzed",
    "opencv-python>=4.5",
]

[tool.uv.sources]
threed-mouse = { git = "https://github.com/hcrlab/3dmouse-hid", branch = "develop", subdirectory = "python" }
net-franky = { git = "https://github.com/yblei/net_franky", branch = "main" }
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.2/whl/linux_x86_64/pyzed-5.2-cp312-cp312-linux_x86_64.whl" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
