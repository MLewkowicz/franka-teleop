[project]
name = "franka-teleop"
version = "0.1.0"
description = "SpaceMouse teleoperation and trajectory recording for Franka Panda"
requires-python = ">=3.10"
dependencies = [
    "net-franky",
    "numpy>=1.20",
    "h5py>=3.0",
    "hydra-core>=1.3",
    "threed-mouse",
]

[project.optional-dependencies]
camera = [
    "opencv-python>=4.5",
]
# pyzed is not on PyPI — install from the ZED SDK wheel:
#   uv pip install /path/to/pyzed-*.whl
# The wheel is downloaded by: python3 /usr/local/zed/get_python_api.py

[tool.uv.sources]
threed-mouse = { git = "https://github.com/hcrlab/3dmouse-hid", branch = "develop", subdirectory = "python" }
net-franky = { git = "https://github.com/yblei/net_franky", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
