[project]
name = "franka-teleop"
version = "0.1.0"
description = "Teleoperation and trajectory recording for Franka Emika robots"
requires-python = ">=3.12,<3.13"
dependencies = [
    "zero-franky",
    "franky-control>=2.0.1.dev9",  # kinematics.jacobian, start_*_impedance_tracker
    "numpy>=1.20",
    "h5py>=3.0",
    "mcap>=1.3",
    "mcap-protobuf-support>=0.5.3",
    "protobuf>=5.29",
    "hydra-core>=1.3",
    "ruckig",
    "toppra",
    "robot-descriptions",
    "threedmouse",
    "trimesh",
    "viser",
    "xacrodoc",
    "yourdfpy",
    "pyzed>=5.2",
]

[project.optional-dependencies]
camera = [
    "pyzed",
    "opencv-python>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
zero-franky = { path = "../zero_franky", editable = true }
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.2/whl/linux_x86_64/pyzed-5.2-cp312-cp312-linux_x86_64.whl" }
franky-control = { index = "franky-dev" }

[[tool.uv.index]]
name = "franky-dev"
url = "https://nickswalker.github.io/franky/branches/fork-dev/whl/libfranka-0.21.2/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling", "grpcio-tools>=1.60"]
build-backend = "hatchling.build"
