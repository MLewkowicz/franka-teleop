[project]
name = "franka-teleop"
version = "0.1.0"
description = "Teleoperation and trajectory recording for Franka Emika robots"
requires-python = ">=3.12"
dependencies = [
    "zero-franky",
    "franky-control",
    "numpy>=1.20",
    "h5py>=3.0",
    "hydra-core>=1.3",
    "robot-descriptions",
    "threedmouse",
    "trimesh",
    "viser",
    "xacrodoc",
    "yourdfpy",
]

[project.optional-dependencies]
camera = [
    "pyzed",
    "opencv-python>=4.5",
]

[tool.uv.sources]
zero-franky = { path = "../zero_franky", editable = true }
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.2/whl/linux_x86_64/pyzed-5.2-cp312-cp312-linux_x86_64.whl" }
franky-control = { url = "https://github.com/nickswalker/franky/releases/download/wheels-libfranka-0.21.1/franky_control-1.1.3+impedance.libfranka.0.21.1-cp312-cp312-manylinux_2_28_x86_64.whl" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
