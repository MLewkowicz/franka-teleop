[project]
name = "franka-teleop"
version = "0.1.0"
description = "SpaceMouse teleoperation and trajectory recording for Franka Panda"
requires-python = ">=3.12"
dependencies = [
    "net-franky",
    "numpy>=1.20",
    "h5py>=3.0",
    "hydra-core>=1.3",
    "robot-descriptions",
    "threedmouse",
    "trimesh",
    "viser",
    "xacrodoc",
    "yourdfpy",
]

[project.optional-dependencies]
camera = [
    "pyzed",
    "opencv-python>=4.5",
]

[tool.uv.sources]
net-franky = { path = "../net_franky", editable = true }
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.2/whl/linux_x86_64/pyzed-5.2-cp312-cp312-linux_x86_64.whl" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
