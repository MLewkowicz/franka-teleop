[project]
name = "franka-teleop"
version = "0.1.0"
description = "Teleoperation and trajectory recording for Franka Emika robots"
requires-python = "==3.12.*"
dependencies = [
    "franky-control",
    "zero-franky",
    "numpy>=1.20",
    "mcap>=1.3",
    "mcap-protobuf-support>=0.5.3",
    "protobuf>=5.29",
    "pyyaml>=6.0",
    "robot-descriptions",
    "threedmouse",
    "oculus_reader",
    "ruckig",
    "toppra",
    "trimesh",
    "viser",
    "websockets",
    "xacrodoc",
    "yourdfpy",
]

[project.optional-dependencies]
camera = [
    "pyzed",
    "opencv-python>=4.5",
]

[tool.uv.sources]
zero-franky = { path = "../zero_franky", editable = true }
oculus_reader = { git = "https://github.com/jborbik/oculus_reader" }
pyzed = { url = "https://download.stereolabs.com/zedsdk/5.2/whl/linux_x86_64/pyzed-5.2-cp312-cp312-linux_x86_64.whl" }
franky-control = { url = "https://github.com/nickswalker/franky/releases/download/wheels-libfranka-0.21.2/franky_control-1.1.4+impedance.libfranka.0.21.2-cp312-cp312-manylinux_2_28_x86_64.whl" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling", "grpcio-tools>=1.60"]
build-backend = "hatchling.build"
